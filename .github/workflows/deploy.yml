name: Deploy to Server

# MANUAL FALLBACK ONLY. Routine deploys no longer run on GitHub Actions: the
# ops loop on the Coolify VPS (ops/loop.sh, see docs/ops-vps.md) polls main
# every 10 minutes and builds + SFTP-deploys whenever it moves. That replaced
# the batched 3x-daily crons that lived here (and the per-push deploys before
# them), because a full ~2,300-page build per run was exhausting the free
# Actions minutes.
#
# Run this by hand (workflow_dispatch) only when the VPS is down or you need
# to publish from CI for some other reason. It always deploys current main.

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache OG images
        uses: actions/cache@v4
        with:
          path: public/images/og
          # Cache the ~2,300 generated OG PNGs by content hash of inputs that
          # affect their output. CSS-only or docs-only changes hit the cache and
          # save ~5 min of Satori rendering. Data updates bust the key.
          key: og-images-v1-${{ hashFiles('data/history/**', 'public/data/*.json', 'scripts/build-archive.mjs', 'scripts/generate-og-images.mjs', 'scripts/og-templates/**', 'package-lock.json') }}

      - name: Build Astro site
        run: npm run build

      # Upload dist/ over SFTP with lftp - the same recipe ops/loop.sh uses on
      # the VPS. SFTP is served by the SSH server's own sftp subsystem, so it
      # needs nothing installed in the account's jailed (CageFS) shell (which
      # has no rsync). Auth reuses the deploy key + port; 10 parallel transfers
      # keep a full re-upload to a few minutes; the whole channel is SSH-encrypted.
      #
      # REMOTE_DIR/SSH_USER are exact on purpose: helloweb's SSH lands in
      # /home/helloweb and f1gures.app is the addon-domain docroot there - NOT
      # public_html (the main HelloWebDesign site). .well-known/cgi-bin are
      # excluded so --delete never prunes the hosting-managed dirs.
      - name: Deploy via SFTP (parallel)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || secrets.SFTP_HOST }}
          SSH_USER: helloweb
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_DIR: f1gures.app
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ]; then
            echo "::error::SSH_PRIVATE_KEY secret is not set - add it before deploying (see docs/deploy-ssh.md)."
            exit 1
          fi
          # Safety net for --delete: never mirror a broken/empty build over the
          # live site. The real dist/ has ~5,000 files; anything under 1,000
          # means the build misfired, so refuse rather than prune production.
          FILES=$(find ./dist -type f | wc -l)
          echo "dist/ contains $FILES files"
          if [ "$FILES" -lt 1000 ]; then
            echo "::error::dist/ has only $FILES files (<1000) - refusing to mirror --delete against the live site."
            exit 1
          fi
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "
            set cmd:fail-exit true;
            set sftp:auto-confirm yes;
            set sftp:connect-program 'ssh -a -x -i $HOME/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=accept-new';
            set net:max-retries 3;
            set net:timeout 30;
            set mirror:parallel-transfer-count 10;
            open -u \"$SSH_USER,\" sftp://$SSH_HOST;
            mirror --reverse --delete --parallel=10 -X .well-known -X cgi-bin --verbose ./dist/ $REMOTE_DIR/;
          "

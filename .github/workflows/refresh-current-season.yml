name: Refresh Current Season

# Pulls the latest race results, qualifying, sprint and standings for the
# current calendar year from the Jolpica API, commits the bundle (so future
# builds have it cached), then rebuilds and SFTP-deploys the site so the
# prerendered HTML reflects the new standings.
#
# Build + upload are gated on the bundle actually having changed. So is
# `npm ci`: the fetch + change-detection path uses only Node built-ins
# (fetch-season.mjs imports nothing from node_modules), so a no-op poll
# skips dependency install entirely and bills ~1 minute instead of 2-3.
# Only a real data change pays for npm ci + build + upload. workflow_dispatch
# bypasses the gate so you can force a redeploy.

on:
  schedule:
    # 04:00 UTC daily - safety net for off-weekends and anything missed by
    # the race-weekend cron below.
    - cron: '0 4 * * *'
    # Race-weekend polling: every 10 min Sat-Sun UTC. Late US/Mexico races and sprint-quali Fridays are caught by the daily 04:00 run above. Bundle-changed gate keeps most runs no-ops.
    - cron: '*/10 * * * 6,0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch current season from Jolpica
        id: fetch
        run: |
          YEAR=$(date -u +%Y)
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          # Don't fail the whole workflow if Jolpica is down or the year
          # has no data yet - the existing bundle (or fallback) keeps
          # the site from regressing.
          node scripts/fetch-season.mjs "$YEAR" || echo "::warning::fetch-season.mjs failed for $YEAR (continuing with existing bundle)"

      - name: Commit bundle if changed
        id: commit
        run: |
          YEAR="${{ steps.fetch.outputs.year }}"
          BUNDLE="public/data/${YEAR}.json"
          if [ ! -f "$BUNDLE" ]; then
            echo "No bundle written for $YEAR - skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$BUNDLE"
          if git diff --cached --quiet; then
            echo "No changes to ${BUNDLE} - skipping build & deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): ${YEAR} season refresh"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: Cache OG images
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: public/images/og
          # Same cache key as deploy.yml - when the fetch updates a season
          # bundle, the bundle hash changes and OGs regenerate. When nothing
          # changed, the cache hits and the build is fast (though we usually
          # skip the build entirely via the changed-gate above).
          key: og-images-v1-${{ hashFiles('data/history/**', 'public/data/*.json', 'public/images/logo/**', 'scripts/build-archive.mjs', 'scripts/generate-og-images.mjs', 'scripts/og-templates/**', 'package-lock.json') }}

      - name: Build Astro site
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: npm run build

      # Same upload as deploy.yml - keep the two steps in sync (see the long
      # rationale there and docs/deploy-ssh.md).
      #
      # This step used to be SamKirkland/FTP-Deploy-Action over plain FTP, left
      # behind when deploy.yml moved to SFTP. That combination was broken: the
      # FTP action diffs against a `.ftp-deploy-sync-state-dist.json` it keeps
      # on the server, and deploy.yml's `mirror --delete` prunes that file, so
      # every refresh run saw an "empty" remote and re-uploaded the whole tree
      # (~1 GB / 13k files) down one FTP connection. Those uploads died with
      # ECONNRESET - most visibly on 2026-09-06, when the run carrying the
      # Italian GP results built fine but never reached the server, leaving
      # /races/2026/13/ showing an empty race tab until the next deploy.yml run.
      - name: Deploy via SFTP (parallel)
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || secrets.SFTP_HOST }}
          SSH_USER: helloweb
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_DIR: f1gures.app
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ]; then
            echo "::error::SSH_PRIVATE_KEY secret is not set - add it before deploying (see docs/deploy-ssh.md)."
            exit 1
          fi
          # Safety net for --delete: never mirror a broken/empty build over the
          # live site. The real dist/ has ~5,000 files; anything under 1,000
          # means the build misfired, so refuse rather than prune production.
          FILES=$(find ./dist -type f | wc -l)
          echo "dist/ contains $FILES files"
          if [ "$FILES" -lt 1000 ]; then
            echo "::error::dist/ has only $FILES files (<1000) - refusing to mirror --delete against the live site."
            exit 1
          fi
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "
            set cmd:fail-exit true;
            set sftp:auto-confirm yes;
            set sftp:connect-program 'ssh -a -x -i $HOME/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=accept-new';
            set net:max-retries 3;
            set net:timeout 30;
            set mirror:parallel-transfer-count 10;
            open -u \"$SSH_USER,\" sftp://$SSH_HOST;
            mirror --reverse --delete --parallel=10 -X .well-known -X cgi-bin --verbose ./dist/ $REMOTE_DIR/;
          "

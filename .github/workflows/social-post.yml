name: Social Posts

# One job, two scheduled shapes, because a result cannot be known in advance
# and an evergreen post must not be rendered long before it goes out.
#
#   daily (23:00 UTC)  the normal path. Posts any result that has landed today,
#                      then renders TOMORROW's evergreen post - roughly twenty
#                      hours before its 19:00 London slot.
#   live  (17:00 UTC)  posts a result that has landed by the European afternoon.
#                      Also carries a same-day evergreen catch-up, which is a
#                      no-op unless last night's run failed to claim today.
#   batch              manual dispatch only. Fills N days ahead for a backfill.
#
# WHY THE HORIZON IS ONE DAY. This used to be a fortnightly `batch` cron that
# rendered fourteen days of cards in one morning. A card is a picture of the
# archive at the moment Satori drew it and a caption's numbers freeze with it,
# so posts went out carrying figures up to a fortnight old: a "drivers'
# championship after 13 rounds" card posted two days after round 14, and a
# current driver's career totals posted six days after a race. Nothing
# downstream can repair that - the PNG is already uploaded.
#
# One day is short enough that no grand prix can fall between render and post:
# race days (and the day either side) are handed to the result passes and
# skipped by the evergreen one, so the gap never spans a session.
#
# The horizon deliberately does NOT chase GitHub's cron drift, which is real -
# these schedules have fired up to 2h45m late. Building the night before leaves
# enough slack that a late run still lands hours before the slot.
#
# Neither shape posts anything by itself. This account's Metricool plan does not
# include REST API access, so scheduling goes through the Metricool MCP, which
# signs in as a person - a cron job has no browser session. CI therefore builds
# the posts, uploads the cards, and commits them to data/social/pending.json;
# a Claude session with the MCP connected runs /social-schedule to place them.
# Set publishVia: 'api' in config once the plan includes the API and this same
# workflow will schedule them itself, unattended.
#
# Settings (post time, networks, draft mode, TikTok music, publish route) live
# in scripts/social/config.mjs - not here. See docs/social-posts.md.

on:
  schedule:
    # Twice daily, because "after the session" is not one time of day:
    #   17:00 UTC catches Europe, the Middle East and Asia-Pacific (a European
    #          race ends ~15:00-16:00 UTC, Suzuka/Melbourne by 07:00 UTC).
    #   23:00 UTC catches the Americas the same night (Austin, Mexico, Miami,
    #          Interlagos and Las Vegas all end between 21:00 and 06:00 UTC),
    #          and is also where tomorrow's evergreen post gets built.
    # A day already posted or already sitting in the pending queue is skipped
    # downstream, so the overlap costs a build, never a duplicate post.
    - cron: '0 17 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which shape to run'
        type: choice
        options: [daily, live, batch]
        default: daily
      date:
        description: 'Evergreen date, or batch start date (YYYY-MM-DD)'
        required: false
      days:
        description: 'Batch only: days to fill (default 14). Anything above 1 posts stale numbers — backfills only.'
        required: false
      dry_run:
        description: 'Build and print only — upload nothing, schedule nothing'
        type: boolean
        default: true

concurrency:
  group: social-post
  cancel-in-progress: false

permissions:
  contents: write   # commits the history log

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Which shape is this? Both crons post results; only the 23:00 one builds
      # tomorrow's evergreen post.
      - name: Resolve mode
        id: mode
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "0 23 * * *" ]; then
            MODE="daily"
          else
            MODE="live"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Running in $MODE mode."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The archive is gitignored, so regenerate it. Importer only - no Astro
      # build, no OG images.
      - name: Build archive
        run: npm run build:archive

      - name: Build posts
        id: build
        run: |
          set -euo pipefail
          MODE="${{ steps.mode.outputs.mode }}"
          DATE_IN="${{ inputs.date }}"

          if [ "$MODE" = "batch" ]; then
            ARGS=("--days=${{ inputs.days || '14' }}")
            if [ -n "$DATE_IN" ]; then ARGS+=("--date=$DATE_IN"); fi
            node scripts/build-social-post.mjs "${ARGS[@]}"
          else
            # Pass 1 - results. A podium card is news, so --asap sends it now
            # rather than holding it for config.postTime. Exits in seconds on
            # the ~90% of days with no session result.
            ARGS=("--angles=race-result,quali-result,sprint-result" "--asap")
            if [ -n "$DATE_IN" ]; then ARGS+=("--date=$DATE_IN"); fi
            node scripts/build-social-post.mjs "${ARGS[@]}"

            # Pass 2 - the evergreen post, rendered as late as it can be.
            #   daily (23:00 UTC): tomorrow, ~20h before its 19:00 London slot.
            #   live  (17:00 UTC): today, as a catch-up. Normally a no-op - the
            #     build skips any date already posted or already queued, so this
            #     only produces anything when last night's run did not.
            # --append keeps pass 1's rendered cards instead of wiping them.
            if [ -n "$DATE_IN" ]; then
              TARGET="$DATE_IN"
            elif [ "$MODE" = "daily" ]; then
              TARGET=$(node -p "new Date(Date.now() + 864e5).toISOString().slice(0, 10)")
            else
              TARGET=$(node -p "new Date().toISOString().slice(0, 10)")
            fi
            echo "Evergreen target: $TARGET"
            node scripts/build-social-post.mjs "--date=$TARGET" --days=1 --append
          fi

          COUNT=$(node -p "require('./.social-out/batch.json').posts.length")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Built $COUNT post(s)."

      # A live run on a day with no session result is the normal case, not a
      # failure - stop here rather than uploading an empty directory.
      - name: Nothing to post
        if: steps.build.outputs.count == '0'
        run: echo "No posts for this run. Exiting cleanly."

      - name: Upload cards to the site
        if: steps.build.outputs.count != '0' && inputs.dry_run != true
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || secrets.SFTP_HOST }}
          SSH_USER: helloweb
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_DIR: f1gures.app/social
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ]; then
            echo "::error::SSH_PRIVATE_KEY is not set - the networks cannot fetch a card without a public URL."
            exit 1
          fi
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          LFTP_OPEN="
            set sftp:auto-confirm yes;
            set sftp:connect-program 'ssh -a -x -i $HOME/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=accept-new';
            set net:max-retries 3;
            set net:timeout 30;
            open -u \"$SSH_USER,\" sftp://$SSH_HOST;
          "

          # Create the remote directory on first use. lftp's `mkdir -p` is NOT
          # shell's: it still errors when the target already exists, and with
          # cmd:fail-exit that aborts the whole script. So this runs on its own
          # and is allowed to fail - a genuine access problem still surfaces on
          # the mirror below, which is strict.
          lftp -c "$LFTP_OPEN mkdir -p $REMOTE_DIR;" || echo "remote dir already present (or mkdir not needed)"

          # Plain mirror, no --delete: this directory is additive, and is
          # excluded from deploy.yml's mirror precisely so it survives.
          lftp -c "
            set cmd:fail-exit true;
            $LFTP_OPEN
            mirror --reverse --only-newer --verbose --include-glob '*.png' --include-glob '*.jpg' ./.social-out/ $REMOTE_DIR/;
          "

      # On the mcp route this queues the posts; on the api route it schedules
      # them. Which one runs is config.publishVia, not a workflow decision.
      - name: Queue or schedule
        if: steps.build.outputs.count != '0' && inputs.dry_run != true
        env:
          METRICOOL_USER_TOKEN: ${{ secrets.METRICOOL_USER_TOKEN }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
          METRICOOL_BLOG_ID: ${{ secrets.METRICOOL_BLOG_ID }}
          SOCIAL_MEDIA_BASE_URL: https://f1gures.app/social
        run: node scripts/publish-social-post.mjs

      - name: Dry run
        if: steps.build.outputs.count != '0' && inputs.dry_run == true
        run: node scripts/publish-social-post.mjs --dry-run

      # The pending queue and the history log are state, not artefacts: the
      # queue is the posts waiting to be scheduled, the log is what stops the
      # feed repeating itself. Both have to go back to the repo.
      - name: Commit the queue and history
        if: steps.build.outputs.count != '0' && inputs.dry_run != true
        run: |
          set -euo pipefail
          if git diff --quiet -- data/social/; then
            echo "nothing changed under data/social/"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/social/
          git commit -m "chore(social): queue ${{ steps.build.outputs.count }} post(s)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push

      - name: Next step
        if: steps.build.outputs.count != '0' && inputs.dry_run != true
        run: |
          echo "::notice::${{ steps.build.outputs.count }} post(s) queued in data/social/pending.json. Open a Claude session with the Metricool MCP connected and run /social-schedule to place them."
